services:
  challenge:
    build: .
    image: devops-ctf/stub-file-served-instead-of-app:latest
    container_name: devops-ctf-9f3fe124
    hostname: challenge
    ports:
      - "${HOST_PORT:-18084}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=9f3fe124-0b43-4b10-9a87-038de18688e0
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
