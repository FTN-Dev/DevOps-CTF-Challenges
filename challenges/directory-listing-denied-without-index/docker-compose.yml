services:
  challenge:
    build: .
    image: devops-ctf/directory-listing-denied-without-index:latest
    container_name: devops-ctf-79cb28a8
    hostname: challenge
    ports:
      - "${HOST_PORT:-18091}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=79cb28a8-959c-451f-8e55-ec63f6e690da
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
