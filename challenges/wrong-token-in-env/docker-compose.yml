services:
  challenge:
    build: .
    image: devops-ctf/wrong-token-in-env:latest
    container_name: devops-ctf-447b71a2
    hostname: challenge
    ports:
      - "${HOST_PORT:-18056}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=447b71a2-21e3-4e08-a75e-e9fa4dba0f6d
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
