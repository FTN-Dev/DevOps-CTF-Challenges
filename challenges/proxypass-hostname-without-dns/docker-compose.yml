services:
  challenge:
    build: .
    image: devops-ctf/proxypass-hostname-without-dns:latest
    container_name: devops-ctf-e6a26cde
    hostname: challenge
    ports:
      - "${HOST_PORT:-18083}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=e6a26cde-38e2-4464-a0c1-ff2ad9bed3c4
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
