services:
  challenge:
    build: .
    image: devops-ctf/redirect-http-ke-https-berputar:latest
    container_name: devops-ctf-b47ebbe6
    hostname: challenge
    ports:
      - "${HOST_PORT:-18071}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=b47ebbe6-8d3c-46db-b3cb-798a826c3975
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
