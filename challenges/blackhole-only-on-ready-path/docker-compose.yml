services:
  challenge:
    build: .
    image: devops-ctf/blackhole-only-on-ready-path:latest
    container_name: devops-ctf-c7a06545
    hostname: challenge
    ports:
      - "${HOST_PORT:-18134}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=c7a06545-930b-41e5-9355-2a9983c25cc8
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
