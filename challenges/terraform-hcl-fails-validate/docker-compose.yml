services:
  challenge:
    build: .
    image: devops-ctf/terraform-hcl-fails-validate:latest
    container_name: devops-ctf-2d10895d
    hostname: challenge
    ports:
      - "${HOST_PORT:-18032}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=2d10895d-551b-461c-b823-4af0b7fbb6ee
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
