services:
  challenge:
    build: .
    image: devops-ctf/proxy-to-wrong-upstream-port:latest
    container_name: devops-ctf-c4a73aac
    hostname: challenge
    ports:
      - "${HOST_PORT:-18086}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=c4a73aac-6924-4423-b8fb-d20b1e822071
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
