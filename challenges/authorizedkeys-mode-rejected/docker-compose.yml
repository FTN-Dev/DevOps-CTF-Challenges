services:
  challenge:
    build: .
    image: devops-ctf/authorizedkeys-mode-rejected:latest
    container_name: devops-ctf-5d338d01
    hostname: challenge
    ports:
      - "${HOST_PORT:-18038}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=5d338d01-a792-4b8b-9349-343f0404cadf
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
