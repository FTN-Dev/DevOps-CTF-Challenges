services:
  challenge:
    build: .
    image: devops-ctf/halaman-default-masih-muncul:latest
    container_name: devops-ctf-6fce354a
    hostname: challenge
    ports:
      - "${HOST_PORT:-18113}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=6fce354a-9f40-4a42-8dcd-c8016075bba6
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
