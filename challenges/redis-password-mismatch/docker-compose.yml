services:
  challenge:
    build: .
    image: devops-ctf/redis-password-mismatch:latest
    container_name: devops-ctf-3063cd6b
    hostname: challenge
    ports:
      - "${HOST_PORT:-18040}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=3063cd6b-1d1d-420e-9ac8-3b1a00f9d35d
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
