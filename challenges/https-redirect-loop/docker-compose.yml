services:
  challenge:
    build: .
    image: devops-ctf/https-redirect-loop:latest
    container_name: devops-ctf-a6f29313
    hostname: challenge
    ports:
      - "${HOST_PORT:-18095}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=a6f29313-9ae7-4d59-aaf1-82502f4dca3b
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
