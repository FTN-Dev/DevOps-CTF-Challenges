services:
  challenge:
    build: .
    image: devops-ctf/token-file-unreadable-by-app-user:latest
    container_name: devops-ctf-b5fb5ce2
    hostname: challenge
    ports:
      - "${HOST_PORT:-18026}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=b5fb5ce2-ab8f-4a3e-9d86-f5f8171065a5
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
