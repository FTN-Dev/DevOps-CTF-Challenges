services:
  challenge:
    build: .
    image: devops-ctf/missing-health-symlink-c6be88:latest
    container_name: devops-ctf-c6be88f0
    hostname: challenge
    ports:
      - "${HOST_PORT:-18111}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=c6be88f0-73dd-4bf6-9e17-70fd59c410b0
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
