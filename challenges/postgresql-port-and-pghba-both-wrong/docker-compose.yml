services:
  challenge:
    build: .
    image: devops-ctf/postgresql-port-and-pghba-both-wrong:latest
    container_name: devops-ctf-7309bd32
    hostname: challenge
    ports:
      - "${HOST_PORT:-18025}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=7309bd32-4ac4-4a98-b6dc-db714a3c23dd
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
