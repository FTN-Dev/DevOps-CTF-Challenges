services:
  challenge:
    build: .
    image: devops-ctf/obs-port-and-path:latest
    container_name: devops-ctf-085aaea6
    hostname: challenge
    ports:
      - "${HOST_PORT:-18011}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=085aaea6-ecd0-46ac-aaa4-b2f237eae4db
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
