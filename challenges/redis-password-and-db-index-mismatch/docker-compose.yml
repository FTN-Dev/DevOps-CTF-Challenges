services:
  challenge:
    build: .
    image: devops-ctf/redis-password-and-db-index-mismatch:latest
    container_name: devops-ctf-8e710263
    hostname: challenge
    ports:
      - "${HOST_PORT:-18023}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=8e710263-c0e4-4276-bbb0-425159d466e5
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
