services:
  challenge:
    build: .
    image: devops-ctf/pghba-rejects-the-app-role:latest
    container_name: devops-ctf-dd215d6a
    hostname: challenge
    ports:
      - "${HOST_PORT:-18042}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=dd215d6a-5fe6-47a2-a2dd-d08e13459430
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
