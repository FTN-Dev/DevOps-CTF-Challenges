services:
  challenge:
    build: .
    image: devops-ctf/bad-tls-certificate-path:latest
    container_name: devops-ctf-7d2d2c52
    hostname: challenge
    ports:
      - "${HOST_PORT:-18053}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=7d2d2c52-c34a-4d3e-bbbb-c2c53f2403b6
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
