services:
  challenge:
    build: .
    image: devops-ctf/git-dirty-and-hook:latest
    container_name: devops-ctf-a1b5f02d
    hostname: challenge
    ports:
      - "${HOST_PORT:-18018}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=a1b5f02d-bd30-49f0-8583-54e001d2b5b3
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
