services:
  challenge:
    build: .
    image: devops-ctf/zombie-processes-and-busy-loop:latest
    container_name: devops-ctf-d188f216
    hostname: challenge
    ports:
      - "${HOST_PORT:-18146}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=d188f216-cd03-4242-8bff-07fb2006904d
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
