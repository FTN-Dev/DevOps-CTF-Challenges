services:
  challenge:
    build: .
    image: devops-ctf/dns-resolver-pointed-at-a-blackhole:latest
    container_name: devops-ctf-9591dec3
    hostname: challenge
    ports:
      - "${HOST_PORT:-18141}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=9591dec3-9ff7-4908-b904-60e00f5f56ca
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
