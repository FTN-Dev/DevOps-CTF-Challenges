services:
  challenge:
    build: .
    image: devops-ctf/old-process-holds-port-9090:latest
    container_name: devops-ctf-f69f67b4
    hostname: challenge
    ports:
      - "${HOST_PORT:-18151}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=f69f67b4-15b4-42ed-9b6c-88f5bf97cde7
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
