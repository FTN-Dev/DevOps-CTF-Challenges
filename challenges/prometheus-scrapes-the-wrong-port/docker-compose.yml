services:
  challenge:
    build: .
    image: devops-ctf/prometheus-scrapes-the-wrong-port:latest
    container_name: devops-ctf-96cc5487
    hostname: challenge
    ports:
      - "${HOST_PORT:-18029}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=96cc5487-bd22-463e-856e-545b66b7cec9
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
