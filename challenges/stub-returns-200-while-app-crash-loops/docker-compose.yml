services:
  challenge:
    build: .
    image: devops-ctf/stub-returns-200-while-app-crash-loops:latest
    container_name: devops-ctf-d0bfa06a
    hostname: challenge
    ports:
      - "${HOST_PORT:-18105}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=d0bfa06a-ff62-4d94-9063-f9ab4bdc18ec
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
