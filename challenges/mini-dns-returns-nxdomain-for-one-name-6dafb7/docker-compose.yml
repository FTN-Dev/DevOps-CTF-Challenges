services:
  challenge:
    build: .
    image: devops-ctf/mini-dns-returns-nxdomain-for-one-name-6dafb7:latest
    container_name: devops-ctf-6dafb786
    hostname: challenge
    ports:
      - "${HOST_PORT:-18125}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=6dafb786-fd1a-43d6-841a-318636f5beb9
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
