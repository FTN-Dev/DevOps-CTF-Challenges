services:
  challenge:
    build: .
    image: devops-ctf/directory-mode-blocks-nginx-user:latest
    container_name: devops-ctf-d8807bd9
    hostname: challenge
    ports:
      - "${HOST_PORT:-18057}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=d8807bd9-ff43-4f59-b8d7-555da1773f5b
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
