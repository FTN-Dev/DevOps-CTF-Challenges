services:
  challenge:
    build: .
    image: devops-ctf/dns-resolver-and-a-record:latest
    container_name: devops-ctf-b75c9b3f
    hostname: challenge
    ports:
      - "${HOST_PORT:-18002}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=b75c9b3f-4b54-41d5-a1c8-411dfbb397b6
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
