services:
  challenge:
    build: .
    image: devops-ctf/shebang-uses-python-not-python3:latest
    container_name: devops-ctf-1197090f
    hostname: challenge
    ports:
      - "${HOST_PORT:-18060}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=1197090f-7fee-4c09-ab4f-b366666ef22e
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
