services:
  challenge:
    build: .
    image: devops-ctf/health-script-not-executable-64a49f:latest
    container_name: devops-ctf-64a49fe6
    hostname: challenge
    ports:
      - "${HOST_PORT:-18127}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=64a49fe6-e3c3-476c-8bfe-d0ffec6493bf
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
