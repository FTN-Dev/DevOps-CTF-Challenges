services:
  challenge:
    build: .
    image: devops-ctf/2mb-log-makes-health-script-refuse-start:latest
    container_name: devops-ctf-da23f0ac
    hostname: challenge
    ports:
      - "${HOST_PORT:-18097}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=da23f0ac-e990-446b-8e71-44e43f97d7c6
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
