services:
  challenge:
    build: .
    image: devops-ctf/static-ok-health-proxies-to-dead-port:latest
    container_name: devops-ctf-3064aaa4
    hostname: challenge
    ports:
      - "${HOST_PORT:-18100}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=3064aaa4-b26f-402d-89ab-a577500b27f6
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
