services:
  challenge:
    build: .
    image: devops-ctf/launcher-cds-to-wrong-directory:latest
    container_name: devops-ctf-737b3de3
    hostname: challenge
    ports:
      - "${HOST_PORT:-18152}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=737b3de3-cd2d-423b-a32d-76d6f6939c3e
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
