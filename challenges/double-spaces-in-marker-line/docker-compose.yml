services:
  challenge:
    build: .
    image: devops-ctf/double-spaces-in-marker-line:latest
    container_name: devops-ctf-81a0651b
    hostname: challenge
    ports:
      - "${HOST_PORT:-18153}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=81a0651b-17a0-4934-8cca-823b0399bdab
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
