services:
  challenge:
    build: .
    image: devops-ctf/wrong-database-name-and-role-password:latest
    container_name: devops-ctf-e34f11ad
    hostname: challenge
    ports:
      - "${HOST_PORT:-18024}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=e34f11ad-bede-4261-96e5-c2881ba4b4ae
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
