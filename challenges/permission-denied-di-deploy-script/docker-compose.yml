services:
  challenge:
    build: .
    image: devops-ctf/permission-denied-di-deploy-script:latest
    container_name: devops-ctf-bed1fd25
    hostname: challenge
    ports:
      - "${HOST_PORT:-18066}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=bed1fd25-4f5c-4a6b-bb82-d150cc32bdcb
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
