services:
  challenge:
    build: .
    image: devops-ctf/ssh-pubkey-and-perm:latest
    container_name: devops-ctf-f2db8a0a
    hostname: challenge
    ports:
      - "${HOST_PORT:-18020}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=f2db8a0a-3181-4b74-b828-c8ea9e47c312
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
