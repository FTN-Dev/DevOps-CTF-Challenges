services:
  challenge:
    build: .
    image: devops-ctf/ci-writes-the-marker-in-the-wrong-directory:latest
    container_name: devops-ctf-40e3b454
    hostname: challenge
    ports:
      - "${HOST_PORT:-18030}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=40e3b454-acce-4f74-b1bf-cc7242fdf0a9
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
