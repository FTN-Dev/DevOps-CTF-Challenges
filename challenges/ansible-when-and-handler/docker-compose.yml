services:
  challenge:
    build: .
    image: devops-ctf/ansible-when-and-handler:latest
    container_name: devops-ctf-548fdec8
    hostname: challenge
    ports:
      - "${HOST_PORT:-18016}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=548fdec8-f530-48da-8d71-e6a0161e0e7a
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
