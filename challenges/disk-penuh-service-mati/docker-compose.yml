services:
  challenge:
    build: .
    image: devops-ctf/disk-penuh-service-mati:latest
    container_name: devops-ctf-ac2048fb
    hostname: challenge
    ports:
      - "${HOST_PORT:-18065}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=ac2048fb-cd3d-4832-b7dd-fbaa47553875
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
