services:
  challenge:
    build: .
    image: devops-ctf/second-server-block-steals-port-80-eeeea5:latest
    container_name: devops-ctf-eeeea557
    hostname: challenge
    ports:
      - "${HOST_PORT:-18115}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=eeeea557-8b32-49bd-92f7-d5f33f9ee869
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
