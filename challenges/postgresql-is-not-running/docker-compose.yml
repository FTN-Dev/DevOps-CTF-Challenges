services:
  challenge:
    build: .
    image: devops-ctf/postgresql-is-not-running:latest
    container_name: devops-ctf-c615848b
    hostname: challenge
    ports:
      - "${HOST_PORT:-18044}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=c615848b-3cb8-454e-afc8-b1476bbfb3a4
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
