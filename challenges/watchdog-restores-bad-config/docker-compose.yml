services:
  challenge:
    build: .
    image: devops-ctf/watchdog-restores-bad-config:latest
    container_name: devops-ctf-538f5a8d
    hostname: challenge
    ports:
      - "${HOST_PORT:-18102}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=538f5a8d-006d-418c-89a6-a752ffceadd2
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
