services:
  challenge:
    build: .
    image: devops-ctf/ansible-when-condition-never-fires:latest
    container_name: devops-ctf-542b78e6
    hostname: challenge
    ports:
      - "${HOST_PORT:-18033}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=542b78e6-51a7-4654-b233-fa184e677f54
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
