services:
  challenge:
    build: .
    image: devops-ctf/redis-bind-and-port-both-wrong:latest
    container_name: devops-ctf-6ff0a9f4
    hostname: challenge
    ports:
      - "${HOST_PORT:-18022}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=6ff0a9f4-95b6-4fcb-a627-33f4b433c400
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
