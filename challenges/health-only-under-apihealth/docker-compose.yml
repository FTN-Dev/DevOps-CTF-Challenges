services:
  challenge:
    build: .
    image: devops-ctf/health-only-under-apihealth:latest
    container_name: devops-ctf-57c6cf1c
    hostname: challenge
    ports:
      - "${HOST_PORT:-18078}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=57c6cf1c-3974-487f-b028-99f1fb556b3c
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
