services:
  challenge:
    build: .
    image: devops-ctf/www-data-cannot-read-html:latest
    container_name: devops-ctf-4a91d61d
    hostname: challenge
    ports:
      - "${HOST_PORT:-18051}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=4a91d61d-683a-4825-8985-ede959d225e7
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
