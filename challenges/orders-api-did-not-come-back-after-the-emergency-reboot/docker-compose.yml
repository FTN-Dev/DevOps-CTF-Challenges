services:
  challenge:
    build: .
    image: devops-ctf/orders-api-did-not-come-back-after-the-emergency-reboot:latest
    container_name: devops-ctf-78932171
    hostname: challenge
    ports:
      - "${HOST_PORT:-18001}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=78932171-d19c-4f18-bab9-2aef904ce552
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
