services:
  challenge:
    build: .
    image: devops-ctf/symlink-points-to-wrong-file:latest
    container_name: devops-ctf-ab9bf941
    hostname: challenge
    ports:
      - "${HOST_PORT:-18121}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=ab9bf941-389c-4ef8-919e-e5903cfdbfda
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
