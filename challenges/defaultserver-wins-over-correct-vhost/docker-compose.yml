services:
  challenge:
    build: .
    image: devops-ctf/defaultserver-wins-over-correct-vhost:latest
    container_name: devops-ctf-45dc4d98
    hostname: challenge
    ports:
      - "${HOST_PORT:-18092}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=45dc4d98-fa04-4a8b-9d01-234aabd12e78
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
