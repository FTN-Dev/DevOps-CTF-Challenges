services:
  challenge:
    build: .
    image: devops-ctf/wrong-port-in-env-file:latest
    container_name: devops-ctf-a719da92
    hostname: challenge
    ports:
      - "${HOST_PORT:-18109}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=a719da92-3fb8-4029-b7d9-a77fbffea115
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
