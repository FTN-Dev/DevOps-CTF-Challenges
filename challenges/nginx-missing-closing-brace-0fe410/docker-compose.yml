services:
  challenge:
    build: .
    image: devops-ctf/nginx-missing-closing-brace-0fe410:latest
    container_name: devops-ctf-0fe41063
    hostname: challenge
    ports:
      - "${HOST_PORT:-18126}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=0fe41063-acc2-465c-9767-456b4288deaf
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
