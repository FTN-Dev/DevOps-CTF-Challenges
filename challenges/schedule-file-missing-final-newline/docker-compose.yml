services:
  challenge:
    build: .
    image: devops-ctf/schedule-file-missing-final-newline:latest
    container_name: devops-ctf-4ca34122
    hostname: challenge
    ports:
      - "${HOST_PORT:-18112}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=4ca34122-9bdd-484b-8c22-69960f20c6d9
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
