services:
  challenge:
    build: .
    image: devops-ctf/parent-ignores-child-empty-response-until-reaped:latest
    container_name: devops-ctf-9c864484
    hostname: challenge
    ports:
      - "${HOST_PORT:-18140}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=9c864484-0781-41cf-b36e-1abe31be3f84
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
