services:
  challenge:
    build: .
    image: devops-ctf/postgresql-listens-on-the-wrong-port:latest
    container_name: devops-ctf-39f80654
    hostname: challenge
    ports:
      - "${HOST_PORT:-18043}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=39f80654-4969-4f20-9da4-eeda342f6aec
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
