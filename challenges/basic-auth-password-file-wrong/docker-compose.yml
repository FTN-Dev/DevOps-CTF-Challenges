services:
  challenge:
    build: .
    image: devops-ctf/basic-auth-password-file-wrong:latest
    container_name: devops-ctf-d76fa843
    hostname: challenge
    ports:
      - "${HOST_PORT:-18138}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=d76fa843-0a72-4126-899e-05bafd400534
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
