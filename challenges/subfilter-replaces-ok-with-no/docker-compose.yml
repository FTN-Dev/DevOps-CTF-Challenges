services:
  challenge:
    build: .
    image: devops-ctf/subfilter-replaces-ok-with-no:latest
    container_name: devops-ctf-4d7f0e30
    hostname: challenge
    ports:
      - "${HOST_PORT:-18135}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=4d7f0e30-ec4c-408a-a474-8b2cfcdc67f7
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
