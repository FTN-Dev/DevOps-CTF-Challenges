  - id: no_beacon_pth
    type: file_absent
    path: "/usr/lib/python3/dist-packages/beacon.pth"
    message: "beacon.pth persistence masih ada"
  - id: billing_health
    type: http
    url: "http://localhost:8080/health"
    expect_status: 200
    message: "billing-api tidak sehat"
  - id: helper_import
    type: command
    cmd: "python3 -c 'import sys; sys.path.insert(0,\"/opt/billing-api\"); import helper; print(helper.health()[\"status\"])'"
    expect_stdout: "ok"
    message: "helper library rusak"