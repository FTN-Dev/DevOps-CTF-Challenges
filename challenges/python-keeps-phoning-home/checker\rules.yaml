challenge_id: "ff3933c8-c4d0-4efb-8611-f7156123939d"
title: "Python keeps phoning home"

allowed_files:
  - "/usr/lib/python3/dist-packages/sitecustomize.py"
  - "/usr/lib/python3/dist-packages/beacon.pth"

forbidden_files:
  - path: "/opt/billing-api/billing_api.py"
    sha256: "e62a6888929703e104d8283bcefcef002da8089285597bd10037e497ed858708"
  - path: "/opt/billing-api/helper.py"
