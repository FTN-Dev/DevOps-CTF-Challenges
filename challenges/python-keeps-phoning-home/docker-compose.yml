services:
  challenge:
    build: .
    image: devops-ctf/python-keeps-phoning-home:latest
    container_name: devops-ctf-ff3933c8
    hostname: challenge
    ports:
      - "${HOST_PORT:-18000}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=ff3933c8-c4d0-4efb-8611-f7156123939d
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
