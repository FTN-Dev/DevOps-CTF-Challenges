services:
  challenge:
    build: .
    image: devops-ctf/cicd-git-branch-and-health:latest
    container_name: devops-ctf-6ea19a2d
    hostname: challenge
    ports:
      - "${HOST_PORT:-18007}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=6ea19a2d-1e83-43f5-b1b1-55bcdd6a7dd9
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
