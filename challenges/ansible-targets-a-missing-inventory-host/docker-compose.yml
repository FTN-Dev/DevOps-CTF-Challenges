services:
  challenge:
    build: .
    image: devops-ctf/ansible-targets-a-missing-inventory-host:latest
    container_name: devops-ctf-51623422
    hostname: challenge
    ports:
      - "${HOST_PORT:-18034}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=51623422-53c8-48bc-9807-73592cf0e7f2
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
