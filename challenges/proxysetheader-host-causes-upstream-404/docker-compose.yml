services:
  challenge:
    build: .
    image: devops-ctf/proxysetheader-host-causes-upstream-404:latest
    container_name: devops-ctf-b0032c66
    hostname: challenge
    ports:
      - "${HOST_PORT:-18090}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=b0032c66-1dc6-408f-b867-c34241c8e426
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
