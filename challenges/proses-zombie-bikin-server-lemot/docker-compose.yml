services:
  challenge:
    build: .
    image: devops-ctf/proses-zombie-bikin-server-lemot:latest
    container_name: devops-ctf-b53b6dcd
    hostname: challenge
    ports:
      - "${HOST_PORT:-18068}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=b53b6dcd-5f7e-47c4-ab94-d1798049ea4a
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
