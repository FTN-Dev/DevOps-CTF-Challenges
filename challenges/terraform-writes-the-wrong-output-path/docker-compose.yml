services:
  challenge:
    build: .
    image: devops-ctf/terraform-writes-the-wrong-output-path:latest
    container_name: devops-ctf-7cefb422
    hostname: challenge
    ports:
      - "${HOST_PORT:-18031}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=7cefb422-39c0-4936-a273-e9b2057688e3
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
