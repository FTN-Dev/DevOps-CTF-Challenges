services:
  challenge:
    build: .
    image: devops-ctf/wrong-nginx-servername:latest
    container_name: devops-ctf-d93b6c48
    hostname: challenge
    ports:
      - "${HOST_PORT:-18061}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=d93b6c48-1474-4535-8eae-a708c4c4cc7e
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
