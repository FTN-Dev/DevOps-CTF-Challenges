services:
  challenge:
    build: .
    image: devops-ctf/nginx-listens-ipv6-only:latest
    container_name: devops-ctf-aa97d56e
    hostname: challenge
    ports:
      - "${HOST_PORT:-18046}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=aa97d56e-a76d-46d7-83ab-80a10ec9386c
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
