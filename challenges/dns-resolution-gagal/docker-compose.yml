services:
  challenge:
    build: .
    image: devops-ctf/dns-resolution-gagal:latest
    container_name: devops-ctf-701bbcb3
    hostname: challenge
    ports:
      - "${HOST_PORT:-18114}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=701bbcb3-453c-429d-857a-ab94beb15be6
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
