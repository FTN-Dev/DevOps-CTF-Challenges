services:
  challenge:
    build: .
    image: devops-ctf/blackhole-nameserver-listed-first:latest
    container_name: devops-ctf-87bf1c45
    hostname: challenge
    ports:
      - "${HOST_PORT:-18093}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=87bf1c45-2442-4c08-bfe3-17eacef77655
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
