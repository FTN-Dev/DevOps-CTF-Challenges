services:
  challenge:
    build: .
    image: devops-ctf/empty-indexhtml:latest
    container_name: devops-ctf-aeaa2511
    hostname: challenge
    ports:
      - "${HOST_PORT:-18107}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=aeaa2511-7b0c-4c5a-b494-2c4956a89d08
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
