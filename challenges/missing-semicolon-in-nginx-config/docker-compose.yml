services:
  challenge:
    build: .
    image: devops-ctf/missing-semicolon-in-nginx-config:latest
    container_name: devops-ctf-9f4c3455
    hostname: challenge
    ports:
      - "${HOST_PORT:-18059}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=9f4c3455-d5bb-472d-b54a-d3e7b9e3f59d
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
