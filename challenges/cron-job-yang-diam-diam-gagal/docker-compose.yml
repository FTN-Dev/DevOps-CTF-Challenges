services:
  challenge:
    build: .
    image: devops-ctf/cron-job-yang-diam-diam-gagal:latest
    container_name: devops-ctf-97623efe
    hostname: challenge
    ports:
      - "${HOST_PORT:-18064}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=97623efe-560f-4b94-93be-36e0c2eedd11
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
