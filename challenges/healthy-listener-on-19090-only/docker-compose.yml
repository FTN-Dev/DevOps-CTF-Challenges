services:
  challenge:
    build: .
    image: devops-ctf/healthy-listener-on-19090-only:latest
    container_name: devops-ctf-a7c4d248
    hostname: challenge
    ports:
      - "${HOST_PORT:-18145}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=a7c4d248-2697-452e-9966-fce31fb411f7
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
