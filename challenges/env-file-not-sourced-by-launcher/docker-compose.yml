services:
  challenge:
    build: .
    image: devops-ctf/env-file-not-sourced-by-launcher:latest
    container_name: devops-ctf-04e52415
    hostname: challenge
    ports:
      - "${HOST_PORT:-18132}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=04e52415-10ab-409d-a2ec-2e8e3f166f1c
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
