services:
  challenge:
    build: .
    image: devops-ctf/log-rotate-lock-left-behind:latest
    container_name: devops-ctf-2abb335a
    hostname: challenge
    ports:
      - "${HOST_PORT:-18094}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=2abb335a-534e-4ab6-a163-b551dac6ebc3
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
