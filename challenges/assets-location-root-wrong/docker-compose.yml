services:
  challenge:
    build: .
    image: devops-ctf/assets-location-root-wrong:latest
    container_name: devops-ctf-a15747ed
    hostname: challenge
    ports:
      - "${HOST_PORT:-18120}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=a15747ed-2446-4faa-9e12-661ecc235eb7
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
