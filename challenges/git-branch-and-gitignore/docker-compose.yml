services:
  challenge:
    build: .
    image: devops-ctf/git-branch-and-gitignore:latest
    container_name: devops-ctf-efd82af9
    hostname: challenge
    ports:
      - "${HOST_PORT:-18019}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=efd82af9-c0d7-4b33-b399-7dfae24cd845
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
