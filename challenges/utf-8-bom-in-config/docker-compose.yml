services:
  challenge:
    build: .
    image: devops-ctf/utf-8-bom-in-config:latest
    container_name: devops-ctf-940a0805
    hostname: challenge
    ports:
      - "${HOST_PORT:-18073}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=940a0805-9122-4446-b3cc-9a279c0e0fec
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
