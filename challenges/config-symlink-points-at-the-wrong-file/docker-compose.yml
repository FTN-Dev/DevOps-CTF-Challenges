services:
  challenge:
    build: .
    image: devops-ctf/config-symlink-points-at-the-wrong-file:latest
    container_name: devops-ctf-1e009dda
    hostname: challenge
    ports:
      - "${HOST_PORT:-18035}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=1e009dda-7444-45f1-90d7-a6651c2de008
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
