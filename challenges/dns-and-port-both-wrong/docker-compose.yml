services:
  challenge:
    build: .
    image: devops-ctf/dns-and-port-both-wrong:latest
    container_name: devops-ctf-ace2cb46
    hostname: challenge
    ports:
      - "${HOST_PORT:-18104}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=ace2cb46-c702-4129-9442-37460e27cf7c
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
