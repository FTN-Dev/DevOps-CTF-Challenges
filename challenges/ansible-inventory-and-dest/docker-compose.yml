services:
  challenge:
    build: .
    image: devops-ctf/ansible-inventory-and-dest:latest
    container_name: devops-ctf-91099b74
    hostname: challenge
    ports:
      - "${HOST_PORT:-18017}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=91099b74-3c8a-41e2-9360-59d9bae564bc
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
