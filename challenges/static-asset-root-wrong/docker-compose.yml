services:
  challenge:
    build: .
    image: devops-ctf/static-asset-root-wrong:latest
    container_name: devops-ctf-d2b70982
    hostname: challenge
    ports:
      - "${HOST_PORT:-18082}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=d2b70982-282a-4656-b3ec-df02fb1237b7
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
