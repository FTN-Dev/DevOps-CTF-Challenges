services:
  challenge:
    build: .
    image: devops-ctf/if-always-redirects-d6be8b:latest
    container_name: devops-ctf-d6be8b0f
    hostname: challenge
    ports:
      - "${HOST_PORT:-18129}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=d6be8b0f-a17d-4d5f-95e3-20ca74ebe04c
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
