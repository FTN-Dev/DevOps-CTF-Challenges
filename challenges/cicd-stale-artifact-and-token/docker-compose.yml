services:
  challenge:
    build: .
    image: devops-ctf/cicd-stale-artifact-and-token:latest
    container_name: devops-ctf-f601f1c7
    hostname: challenge
    ports:
      - "${HOST_PORT:-18012}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=f601f1c7-a9e9-42b1-8b7b-64cf2869267f
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
