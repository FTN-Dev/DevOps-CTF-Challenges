services:
  challenge:
    build: .
    image: devops-ctf/active-config-is-the-broken-one:latest
    container_name: devops-ctf-7d0b1761
    hostname: challenge
    ports:
      - "${HOST_PORT:-18108}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=7d0b1761-122c-4421-b92b-52197e08d014
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
