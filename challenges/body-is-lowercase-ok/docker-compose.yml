services:
  challenge:
    build: .
    image: devops-ctf/body-is-lowercase-ok:latest
    container_name: devops-ctf-8a1ee724
    hostname: challenge
    ports:
      - "${HOST_PORT:-18072}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=8a1ee724-e48c-4a81-a46a-b1525656af5d
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
