services:
  challenge:
    build: .
    image: devops-ctf/schedule-path-with-spaces-unquoted:latest
    container_name: devops-ctf-466d2cf1
    hostname: challenge
    ports:
      - "${HOST_PORT:-18076}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=466d2cf1-a00d-4776-9875-10a400654a88
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
