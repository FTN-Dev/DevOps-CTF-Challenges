services:
  challenge:
    build: .
    image: devops-ctf/broken-sites-enabled-symlink:latest
    container_name: devops-ctf-9cf52ea6
    hostname: challenge
    ports:
      - "${HOST_PORT:-18089}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=9cf52ea6-e4e2-4861-ab4e-884d732d7719
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
