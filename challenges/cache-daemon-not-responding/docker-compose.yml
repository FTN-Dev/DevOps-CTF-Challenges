services:
  challenge:
    build: .
    image: devops-ctf/cache-daemon-not-responding:latest
    container_name: devops-ctf-cache-daemon
    hostname: challenge
    ports:
      - "${HOST_PORT:-18041}:6379"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=cache-daemon-not-responding
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]