services:
  challenge:
    build: .
    image: devops-ctf/typo-pyhton3-in-launcher:latest
    container_name: devops-ctf-5b7d383b
    hostname: challenge
    ports:
      - "${HOST_PORT:-18148}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=5b7d383b-0a73-4002-970f-22562086e9b0
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
