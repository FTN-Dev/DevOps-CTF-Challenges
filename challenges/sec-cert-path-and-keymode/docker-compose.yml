services:
  challenge:
    build: .
    image: devops-ctf/sec-cert-path-and-keymode:latest
    container_name: devops-ctf-13c5a157
    hostname: challenge
    ports:
      - "${HOST_PORT:-18009}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=13c5a157-5133-46bc-8d7a-262a7e5ac2dd
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
