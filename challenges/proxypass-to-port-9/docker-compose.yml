services:
  challenge:
    build: .
    image: devops-ctf/proxypass-to-port-9:latest
    container_name: devops-ctf-7c68523a
    hostname: challenge
    ports:
      - "${HOST_PORT:-18077}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=7c68523a-0fb5-4b9e-9e01-4e6cda7b03e0
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
