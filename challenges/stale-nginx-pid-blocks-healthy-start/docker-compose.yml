services:
  challenge:
    build: .
    image: devops-ctf/stale-nginx-pid-blocks-healthy-start:latest
    container_name: devops-ctf-587042dd
    hostname: challenge
    ports:
      - "${HOST_PORT:-18139}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=587042dd-270c-45d3-88af-bc426214d22a
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
