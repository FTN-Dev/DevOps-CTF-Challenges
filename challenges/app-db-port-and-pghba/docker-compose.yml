services:
  challenge:
    build: .
    image: devops-ctf/app-db-port-and-pghba:latest
    container_name: devops-ctf-bd0ffb69
    hostname: challenge
    ports:
      - "${HOST_PORT:-18005}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=bd0ffb69-a195-4ecc-a848-93083712e08e
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
