services:
  challenge:
    build: .
    image: devops-ctf/limitreq-zone-too-strict:latest
    container_name: devops-ctf-8bbb0752
    hostname: challenge
    ports:
      - "${HOST_PORT:-18136}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=8bbb0752-facf-402c-aed0-a2a98175a71d
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
