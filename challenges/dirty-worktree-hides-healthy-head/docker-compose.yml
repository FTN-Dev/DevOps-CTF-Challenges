services:
  challenge:
    build: .
    image: devops-ctf/dirty-worktree-hides-healthy-head:latest
    container_name: devops-ctf-cf999878
    hostname: challenge
    ports:
      - "${HOST_PORT:-18036}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=cf999878-716c-4009-adf8-144dc5a27d2d
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
