services:
  challenge:
    build: .
    image: devops-ctf/prometheus-scrape-port-and-path:latest
    container_name: devops-ctf-43a15fa1
    hostname: challenge
    ports:
      - "${HOST_PORT:-18003}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=43a15fa1-9284-4ff3-aba6-849c9e902578
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
