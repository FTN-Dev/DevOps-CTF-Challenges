services:
  challenge:
    build: .
    image: devops-ctf/prometheus-rule-file-not-loaded:latest
    container_name: devops-ctf-46f18c6d
    hostname: challenge
    ports:
      - "${HOST_PORT:-18028}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=46f18c6d-6ab0-453a-9236-2ea399f5cbd4
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
