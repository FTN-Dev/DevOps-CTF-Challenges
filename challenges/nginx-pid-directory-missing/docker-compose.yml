services:
  challenge:
    build: .
    image: devops-ctf/nginx-pid-directory-missing:latest
    container_name: devops-ctf-c0d10ac2
    hostname: challenge
    ports:
      - "${HOST_PORT:-18133}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=c0d10ac2-d747-4e08-921c-efac971c33de
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
