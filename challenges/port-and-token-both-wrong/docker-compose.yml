services:
  challenge:
    build: .
    image: devops-ctf/port-and-token-both-wrong:latest
    container_name: devops-ctf-97d58f91
    hostname: challenge
    ports:
      - "${HOST_PORT:-18144}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=97d58f91-5147-4edb-a65e-689ce8df5648
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
