services:
  challenge:
    build: .
    image: devops-ctf/ssh-wrong-port-and-allowusers:latest
    container_name: devops-ctf-29987154
    hostname: challenge
    ports:
      - "${HOST_PORT:-18021}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=29987154-1a59-4eeb-a494-a5b19c128369
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
