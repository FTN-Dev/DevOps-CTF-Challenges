services:
  challenge:
    build: .
    image: devops-ctf/nginx-tidak-mau-start:latest
    container_name: devops-ctf-02d9ac85
    hostname: challenge
    ports:
      - "${HOST_PORT:-18069}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=02d9ac85-3c48-490b-bc0b-bb212dd20f1e
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
