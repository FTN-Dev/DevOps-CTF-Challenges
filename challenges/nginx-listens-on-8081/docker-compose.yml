services:
  challenge:
    build: .
    image: devops-ctf/nginx-listens-on-8081:latest
    container_name: devops-ctf-230ce2c8
    hostname: challenge
    ports:
      - "${HOST_PORT:-18118}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=230ce2c8-d713-4594-a083-48519b14e2f6
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
