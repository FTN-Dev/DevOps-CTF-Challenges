services:
  challenge:
    build: .
    image: devops-ctf/wrong-search-domain-in-resolvconf:latest
    container_name: devops-ctf-93e76eda
    hostname: challenge
    ports:
      - "${HOST_PORT:-18052}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=93e76eda-2710-49ee-8850-250b5b0e5d45
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
