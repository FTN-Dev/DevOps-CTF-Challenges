services:
  challenge:
    build: .
    image: devops-ctf/accept-then-close-before-body:latest
    container_name: devops-ctf-54a1c2f7
    hostname: challenge
    ports:
      - "${HOST_PORT:-18099}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=54a1c2f7-51ac-4f44-8154-8c06b78b8a2d
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
