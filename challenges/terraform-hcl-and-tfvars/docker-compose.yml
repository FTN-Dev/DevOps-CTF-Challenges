services:
  challenge:
    build: .
    image: devops-ctf/terraform-hcl-and-tfvars:latest
    container_name: devops-ctf-0b911db0
    hostname: challenge
    ports:
      - "${HOST_PORT:-18015}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=0b911db0-de65-4ed9-b83b-e51db9d4d6c6
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
