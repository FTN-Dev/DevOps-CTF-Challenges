services:
  challenge:
    build: .
    image: devops-ctf/tls-private-key-permissions-block-start:latest
    container_name: devops-ctf-fe21522c
    hostname: challenge
    ports:
      - "${HOST_PORT:-18027}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=fe21522c-82fe-4f3f-bbef-2bf1e1e5b611
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
