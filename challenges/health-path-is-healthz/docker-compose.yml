services:
  challenge:
    build: .
    image: devops-ctf/health-path-is-healthz:latest
    container_name: devops-ctf-ec7b340d
    hostname: challenge
    ports:
      - "${HOST_PORT:-18117}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=ec7b340d-52da-40e1-a0ee-5dc03f27c20f
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
