services:
  challenge:
    build: .
    image: devops-ctf/wrong-a-record-in-zone-like-file:latest
    container_name: devops-ctf-4441a28b
    hostname: challenge
    ports:
      - "${HOST_PORT:-18098}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=4441a28b-6296-4c8a-b5c5-b4b69e7978e5
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
