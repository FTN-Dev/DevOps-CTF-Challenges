services:
  challenge:
    build: .
    image: devops-ctf/schedule-user-cannot-execute-script:latest
    container_name: devops-ctf-66e19c75
    hostname: challenge
    ports:
      - "${HOST_PORT:-18119}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=66e19c75-b5f8-4f7e-a8ba-e307629dd5dd
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
