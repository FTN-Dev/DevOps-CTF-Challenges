services:
  challenge:
    build: .
    image: devops-ctf/wrong-host-route-for-one-destination:latest
    container_name: devops-ctf-4928c228
    hostname: challenge
    ports:
      - "${HOST_PORT:-18103}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=4928c228-b9f6-404e-99dd-fdcf944b49d6
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
