services:
  challenge:
    build: .
    image: devops-ctf/scheduler-cannot-find-command-due-to-home:latest
    container_name: devops-ctf-c0c91d48
    hostname: challenge
    ports:
      - "${HOST_PORT:-18147}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=c0c91d48-7d70-4b45-ac4c-a00d587343e0
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
