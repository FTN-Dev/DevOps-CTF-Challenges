services:
  challenge:
    build: .
    image: devops-ctf/app-redis-port-and-password:latest
    container_name: devops-ctf-be5a3d96
    hostname: challenge
    ports:
      - "${HOST_PORT:-18004}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=be5a3d96-c78b-4be1-a198-c92f3c7c3157
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
