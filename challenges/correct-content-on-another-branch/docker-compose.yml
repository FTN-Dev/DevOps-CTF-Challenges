services:
  challenge:
    build: .
    image: devops-ctf/correct-content-on-another-branch:latest
    container_name: devops-ctf-cad94a2f
    hostname: challenge
    ports:
      - "${HOST_PORT:-18037}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=cad94a2f-1418-4444-a89c-20534532f0db
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
