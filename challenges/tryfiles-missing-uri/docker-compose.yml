services:
  challenge:
    build: .
    image: devops-ctf/tryfiles-missing-uri:latest
    container_name: devops-ctf-1cf5d1b4
    hostname: challenge
    ports:
      - "${HOST_PORT:-18096}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=1cf5d1b4-cbd9-486d-96f3-a637ff30010d
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
