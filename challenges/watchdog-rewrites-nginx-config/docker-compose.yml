services:
  challenge:
    build: .
    image: devops-ctf/watchdog-rewrites-nginx-config:latest
    container_name: devops-ctf-6796af9e
    hostname: challenge
    ports:
      - "${HOST_PORT:-18142}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=6796af9e-3137-43a9-a121-88c8a68b145b
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
