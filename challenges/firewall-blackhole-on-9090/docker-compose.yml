services:
  challenge:
    build: .
    image: devops-ctf/firewall-blackhole-on-9090:latest
    container_name: devops-ctf-5c9f0c93
    hostname: challenge
    ports:
      - "${HOST_PORT:-18131}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=5c9f0c93-7c33-420f-b4c0-fd400b675a6b
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
