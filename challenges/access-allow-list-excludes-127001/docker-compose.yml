services:
  challenge:
    build: .
    image: devops-ctf/access-allow-list-excludes-127001:latest
    container_name: devops-ctf-19463137
    hostname: challenge
    ports:
      - "${HOST_PORT:-18137}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=19463137-b2cf-4c98-b777-cad8acb15437
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
