services:
  challenge:
    build: .
    image: devops-ctf/app-reads-wrong-filename-f00d9f:latest
    container_name: devops-ctf-f00d9f39
    hostname: challenge
    ports:
      - "${HOST_PORT:-18116}:80"
    volumes:
      - ./config:/opt/challenge-config
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
      - CHALLENGE_ID=f00d9f39-33d8-4e24-a71b-01044583f67c
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    command: ["/entrypoint.sh"]

  checker:
    image: devops-ctf-checker:latest
    volumes:
      - ./checker/rules.yaml:/checker/rules.yaml:ro
      - ./config:/data:ro
    environment:
      - CHECKER_ENABLED=${CHECKER_ENABLED:-true}
    profiles: ["checker"]
    command: ["python3", "/checker/run.py"]
